[project]
name = "smm-fastapi"
version = "0.1.0"
description = "FastAPI backend for the SMM application"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
dev = "main:dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]

[tool.hatch.build.targets.wheel.sources]
"." = ""
